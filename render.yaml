services:
  - type: web
    name: anemi-scan
    runtime: python
    plan: free
    buildCommand: >-
      pip install --upgrade pip &&
      pip install torch==2.0.0+cpu torchvision==0.15.1+cpu --index-url https://download.pytorch.org/whl/cpu &&
      pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn.conf.py app:app
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: ANEMIA_TORCH_THREADS
        value: "1"
      - key: ANEMIA_ENABLE_GRADCAM
        value: "false"
      - key: ANEMIA_GUNICORN_TIMEOUT
        value: "180"
      - key: ANEMIA_RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: MAX_UPLOAD_MB
        value: "16"
